events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ── Logs ─────────────────────────────────────────────
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ── Upstreams (Localizadores dos Serviços) ───────────
  upstream frontend_service {
    # Aponta para o seu serviço de frontend Node.js
    server front:8081; 
  }

  upstream document_service {
    server document-service:3001;
  }

  upstream face_recognition_backend {
    server face-recognition:5000; 
  }

  # ── Gateway Principal (Porta 80) ──────────────────────
  server {
    listen 8082;
    server_name _;

    # ── 1. Rota do Serviço do Frontend ──────────────────
    location / {
      proxy_pass         http://frontend_service;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }

    # ── 2. Rota do Document Service ─────────────────────
    location /docs/ {
      proxy_pass         http://document_service/docs/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      
      client_max_body_size 2m;
    }

    # ── 3. Rota do Reconhecimento Facial (Direto) ───────
    location /face/ {
      rewrite ^/face/(.*)$ /$1 break;

      proxy_pass         http://face_recognition_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

      client_max_body_size 5m;
      proxy_read_timeout 15s;
    }

    # ── Health do Gateway ─────────────────────────────
    location /health {
      access_log off;
      return 200 '{"status":"gateway_ok"}';
      add_header Content-Type application/json;
    }
  }
}
