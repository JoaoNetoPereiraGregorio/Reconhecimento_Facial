events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 10M;

    upstream front_service {
        server front:8081;
    }

    upstream document_service {
        server document-service:8083;
    }

    upstream face_service {
        server face-recognition:5000;
    }

    server {
        listen 8082;

        # ── Health check ──────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend ──────────────────────────────────────
        location / {
            proxy_pass         http://front_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Document service ──────────────────────────────
        location /docs/ {
            proxy_pass         http://document_service/docs/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Content-Type nao precisa ser repassado manualmente
        }

        # ── Face recognition ──────────────────────────────
        location /face/ {
            proxy_pass         http://face_service/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}